server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://depot-api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Data is generated during the upstream build and must never be routed to
    # index.html: API-like JSON requests need their real file or a 404.
    location ^~ /data/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # React BrowserRouter routes need the application shell on direct loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
