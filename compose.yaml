name: warhammer-dev

networks:
  default:
    # Keep this project independent of Docker's exhausted predefined pools;
    # Compose still namespaces the actual network by project name.
    ipam:
      config:
        - subnet: "10.250.0.0/16"

# The default Compose file is deliberately a safe, disposable local
# development topology. Production deployment scripts add
# compose.prod.yaml explicitly.
services:
  depot-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DEPOT_POSTGRES_DB:-depot}"
      POSTGRES_USER: "${DEPOT_POSTGRES_USER:-depot}"
      # This value is only for the isolated development project. Production
      # scripts require DEPOT_POSTGRES_PASSWORD in compose.prod.yaml.
      POSTGRES_PASSWORD: "${DEPOT_POSTGRES_PASSWORD:-warhammer-dev-only}"
    volumes:
      - depot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  depot-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        WARHAMMER_PARENT_REVISION: "${WARHAMMER_PARENT_REVISION:-unknown}"
        DEPOT_SOURCE_REVISION: "${DEPOT_SOURCE_REVISION:-unknown}"
    image: warhammer-depot-api:production
    labels:
      org.opencontainers.image.source.revision: "${WARHAMMER_PARENT_REVISION:-unknown}"
      com.warhammer.depot.revision: "${DEPOT_SOURCE_REVISION:-unknown}"
    restart: unless-stopped
    environment:
      PORT: 8787
      DEPOT_USER_ID: "${DEPOT_USER_ID:-00000000-0000-0000-0000-000000000001}"
      DATABASE_URL: "postgresql://${DEPOT_POSTGRES_USER:-depot}:${DEPOT_POSTGRES_PASSWORD:-warhammer-dev-only}@depot-db:5432/${DEPOT_POSTGRES_DB:-depot}"
    depends_on:
      depot-db:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  depot-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WARHAMMER_PARENT_REVISION: "${WARHAMMER_PARENT_REVISION:-unknown}"
        DEPOT_SOURCE_REVISION: "${DEPOT_SOURCE_REVISION:-unknown}"
    image: warhammer-depot:production
    labels:
      org.opencontainers.image.source.revision: "${WARHAMMER_PARENT_REVISION:-unknown}"
      com.warhammer.depot.revision: "${DEPOT_SOURCE_REVISION:-unknown}"
    restart: unless-stopped
    ports:
      - target: 80
        published: "${DEPOT_PORT:-19096}"
        host_ip: "127.0.0.1"
        protocol: tcp
    init: true
    depends_on:
      depot-api:
        condition: service_healthy

  depot-backup:
    image: alpine:3.22
    restart: unless-stopped
    depends_on:
      depot-api:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL_SECONDS: "${DEPOT_BACKUP_INTERVAL_SECONDS:-21600}"
      BACKUP_RETENTION: "${DEPOT_BACKUP_RETENTION:-20}"
    volumes:
      - ./runtime/backups/depot:/backups
    command: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null; while true; do chown -R 1000:100 /backups; stamp=$$(date -u +%Y-%m-%dT%H%M%SZ); tmp=/backups/.depot-backup-$$stamp.json.tmp; curl --fail --silent http://depot-api:8787/api/export > $$tmp && mv $$tmp /backups/depot-backup-$$stamp.json; chown -R 1000:100 /backups; ls -1t /backups/depot-backup-*.json 2>/dev/null | tail -n +$$(($$BACKUP_RETENTION + 1)) | xargs -r rm -f; sleep $$BACKUP_INTERVAL_SECONDS; done"]

  home:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./launcher:/usr/share/nginx/html:ro
      - ./nginx/launcher.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - target: 80
        published: "${WARHAMMER_HOME_PORT:-18085}"
        host_ip: "127.0.0.1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]

  munda-web:
    build:
      context: .
      dockerfile: Dockerfile.munda
      args:
        MUNDA_BUILD_SUPABASE_URL: "${MUNDA_SUPABASE_URL:-http://localhost:54321}"
        MUNDA_BUILD_SUPABASE_ANON_KEY: "${MUNDA_SUPABASE_ANON_KEY:-local-anon-key}"
        WARHAMMER_PARENT_REVISION: "${WARHAMMER_PARENT_REVISION:-unknown}"
        MUNDA_SOURCE_REVISION: "${MUNDA_SOURCE_REVISION:-unknown}"
    image: warhammer-munda:production
    labels:
      org.opencontainers.image.source.revision: "${WARHAMMER_PARENT_REVISION:-unknown}"
      com.warhammer.munda.revision: "${MUNDA_SOURCE_REVISION:-unknown}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: "${MUNDA_APP_URL:-http://localhost:18087}"
      NEXT_PUBLIC_SUPABASE_URL: "${MUNDA_SUPABASE_URL:-http://localhost:54321}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${MUNDA_SUPABASE_ANON_KEY:-local-anon-key}"
      MUNDA_SUPABASE_INTERNAL_URL: "${MUNDA_SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}"
      SUPABASE_SERVICE_ROLE_KEY: "${MUNDA_SUPABASE_SERVICE_ROLE_KEY:-}"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${MUNDA_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
      TURNSTILE_SECRET_KEY: "${MUNDA_TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - target: 3000
        published: "${MUNDA_PORT:-18087}"
        host_ip: "127.0.0.1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]

  depot-test:
    build:
      context: ./vendor/depot
      dockerfile: Dockerfile.test
    profiles: ["test"]
    init: true
    working_dir: /app
    volumes:
      - ./data/depot-source:/app/packages/cli/dist/source_data:ro

  depot-data-refresh:
    image: node:24-bookworm-slim
    profiles: ["data"]
    user: "${DEPOT_DATA_UID:-1000}:${DEPOT_DATA_GID:-100}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["node", "scripts/depot-data-cache.mjs", "--refresh"]

  depot-data-test:
    image: node:24-bookworm-slim
    profiles: ["data"]
    user: "${DEPOT_DATA_UID:-1000}:${DEPOT_DATA_GID:-100}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["node", "--test", "scripts/depot-data-cache.test.mjs"]

  depot-e2e:
    build:
      context: ./vendor/depot
      dockerfile: Dockerfile.test
    profiles: ["e2e"]
    init: true
    working_dir: /app
    environment:
      WEB_BASE_URL: "http://depot-web"
    depends_on:
      depot-web:
        condition: service_healthy

  chrome-devtools-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.chrome-devtools-mcp
    profiles: ["development-tools"]
    init: true
    stdin_open: true
    tty: false
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  depot-db-data:
    name: warhammer-dev-depot-db-data
