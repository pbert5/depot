services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DEPOT_POSTGRES_DB:-depot}"
      POSTGRES_USER: "${DEPOT_POSTGRES_USER:-depot}"
      POSTGRES_PASSWORD: "${DEPOT_POSTGRES_PASSWORD:?Set DEPOT_POSTGRES_PASSWORD in .env}"
    volumes:
      - depot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: depot-api:local
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_URL: "postgresql://${DEPOT_POSTGRES_USER:-depot}:${DEPOT_POSTGRES_PASSWORD:?Set DEPOT_POSTGRES_PASSWORD in .env}@db:5432/${DEPOT_POSTGRES_DB:-depot}"
      DEPOT_USER_ID: "${DEPOT_USER_ID:-00000000-0000-0000-0000-000000000001}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: depot:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    init: true
    ports:
      - "127.0.0.1:${DEPOT_PORT:-19096}:80"

volumes:
  depot-db-data:
